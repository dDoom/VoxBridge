[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echopilot"
version = "0.2.0"
description = "AI companion for calls with real-time translation, co-pilot hints, avatar sync, and mobile bridge."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "PySide6>=6.7",
    "sounddevice>=0.4.6",
    "soundcard>=0.4.6",
    "websockets>=12.0,<16",
    "pymupdf>=1.23",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-docx>=1.1",
    "pyvirtualcam>=0.11",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.6",
]

[project.scripts]
echopilot = "echopilot.__main__:main"

[tool.setuptools.packages.find]
include = ["echopilot*"]
