name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            archive: zip
            build_portable: true
          - name: linux-x64
            os: ubuntu-24.04
            archive: tar.gz
            build_portable: false
          - name: macos-arm64
            os: macos-15
            archive: zip
            build_portable: false
          - name: macos-intel
            os: macos-15-intel
            archive: zip
            build_portable: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libasound2-dev

      - name: Install Python dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[build]"

      - name: Build app bundle
        run: pyinstaller --clean -y VoxBridge.spec

      - name: Build Windows portable executable
        if: matrix.build_portable
        run: pyinstaller --clean -y VoxBridgePortable.spec

      - name: Package app bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifactName = "VoxBridge-${{ github.ref_name }}-${{ matrix.name }}"
          $bundlePath = Join-Path "dist" "VoxBridge"

          if ("${{ matrix.archive }}" -eq "zip") {
            Compress-Archive -Path (Join-Path $bundlePath "*") -DestinationPath "$artifactName.zip" -Force
          } else {
            tar -czf "$artifactName.tar.gz" -C "dist" "VoxBridge"
          }

          if ("${{ matrix.build_portable }}" -eq "true") {
            Copy-Item "dist/VoxBridgePortable.exe" "$artifactName-portable.exe"
          }

      - name: Generate checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -File "VoxBridge-${{ github.ref_name }}-${{ matrix.name }}*"
          foreach ($file in $files) {
            $hash = Get-FileHash $file.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($file.Name)" | Out-File "$($file.Name).sha256" -Encoding ascii
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoxBridge-${{ github.ref_name }}-${{ matrix.name }}
          path: |
            VoxBridge-${{ github.ref_name }}-${{ matrix.name }}*

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VoxBridge-${{ github.ref_name }}-${{ matrix.name }}*
          generate_release_notes: true
