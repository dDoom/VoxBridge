name: Update v0.1.4 Release Notes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-release-v014.yml"

permissions:
  contents: write

jobs:
  update-release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Update v0.1.4 release body
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              "## Highlights",
              "",
              "VoxBridge v0.1.4 adds proper audio-output control for calls where translated subtitles are enough, but the original audio still needs to keep flowing.",
              "",
              "## What's New",
              "",
              "- Added a per-direction **Play translated audio** toggle.",
              "- Added **Original passthrough** volume control from **0%** to **100%** for each direction.",
              "- When translated audio is disabled, original passthrough automatically switches to **100%**, so subtitle-only mode does not mute the call audio.",
              "- Output device selection is now required only when a route actually needs playback: translated audio enabled or original passthrough above **0%**.",
              "- Updated the README screenshots and feature descriptions for the new controls.",
              "",
              "## Audio Behavior",
              "",
              "- **Translated audio on, original passthrough 0%**: classic translated voice output.",
              "- **Translated audio off, original passthrough 100%**: original audio continues through while translated text appears in transcripts.",
              "- **Translated audio on, original passthrough above 0%**: original audio is mixed with the translated voice at the selected volume.",
              "",
              "## Under the Hood",
              "",
              "- Reworked output playback to use a small mixer inside `SpeakerOutput`, so original and translated audio can be combined through the same output callback.",
              "- Added route config fields for translated audio playback and original audio passthrough volume.",
              "- Bumped package version to `0.1.4`.",
              "",
              "## Downloads",
              "",
              "Choose the build for your platform below. SHA256 checksum files are attached for verification.",
              "",
              "**Full Changelog**: https://github.com/dDoom/VoxBridge/compare/v0.1.2...v0.1.4"
            ].join("\\n");

            const { owner, repo } = context.repo;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner,
              repo,
              tag: "v0.1.4",
            });

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              name: "VoxBridge v0.1.4",
              body,
              draft: false,
              prerelease: false,
            });
